name: Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install System Dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y -qq git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev ant

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade Cython==0.29.36 buildozer

    - name: Set up python-for-android
      run: |
        git clone -b master https://github.com/kivy/python-for-android.git /tmp/p4a
        sed -i 's/pip install -U pip/true/g' /tmp/p4a/pythonforandroid/build.py

    - name: Generate buildozer.spec
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Dam Monitor
        package.name = dammonitor
        package.domain = org.dam
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 0.1
        requirements = python3,kivy,pillow
        icon.filename = %(source.dir)s/dam_icon.png
        orientation = portrait
        fullscreen = 0
        android.archs = arm64-v8a, armeabi-v7a
        android.allow_backup = True
        android.accept_sdk_license = True
        p4a.source_dir = /tmp/p4a

        [buildozer]
        log_level = 2
        warn_on_root = 0
        EOF

    - name: Build APK with Buildozer
      run: |
        for i in {1..3}; do
          buildozer android debug && break || echo "Download timed out, retrying..."
          sleep 10
        done

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dam-monitor-apk
        path: bin/*.apk
