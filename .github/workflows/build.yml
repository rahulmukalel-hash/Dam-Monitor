name: Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y -qq git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade Cython==0.29.36 buildozer

    - name: Set up python-for-android
      run: |
        git clone https://github.com/kivy/python-for-android.git /tmp/p4a
        sed -i 's/pip install -U pip/true/g' /tmp/p4a/pythonforandroid/build.py
        
        # fix for libthorvg / libomp
        python3 -c "
        path = '/tmp/p4a/pythonforandroid/recipes/libthorvg/__init__.py'
        with open(path, 'r') as f:
            text = f.read()
        fix = '''target_k = 'aarch64' if '64' in arch.arch else '/arm/'
        found_omps = [p for p in __import__('glob').glob(self.ctx.ndk_dir + '/**/libomp.so', recursive=True) if target_k in p]
        clang_lib_dir = __import__('os').path.dirname(found_omps[0]) if found_omps else self.ctx.ndk_dir'''
        text = text.replace('clang_lib_dir = glob(pattern)[0]', fix)
        with open(path, 'w') as f:
            f.write(text)
        "

    - name: Generate buildozer.spec
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Dam Monitor
        package.name = dammonitor
        package.domain = org.dam
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 0.1
        requirements = python3,kivy,pillow
        icon.filename = %(source.dir)s/dam_icon.png
        orientation = portrait
        fullscreen = 0
        android.archs = arm64-v8a, armeabi-v7a
        android.allow_backup = True
        p4a.source_dir = /tmp/p4a

        [buildozer]
        log_level = 2
        warn_on_root = 0
        EOF

    - name: Build APK with Buildozer
      run: |
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dam-monitor-apk
        path: bin/*.apk
